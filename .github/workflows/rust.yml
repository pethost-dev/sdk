# Publishes a tagged version of the Rust SDK, rust/, to crates.io; docs.rs builds its pages by
# itself afterwards.
#
# This repository is generated: Pethost's own repository writes each SDK's directory from the
# API's description, proto/, and pushes it here with its tag, rust/v<version>. Nothing here is
# edited by hand but the workflows.
# crates.io takes the release by trusted publishing: this run trades its identity for a token
# that lasts as long as the run, as rust-lang/crates-io-auth-action does, and gives it back.
#
# By hand (workflow_dispatch) it publishes what main holds: for a tag whose own run failed on
# this file as it then was, since a run again reads the file of the tag's commit.
name: Rust

on:
  push:
    tags: ['rust/v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

defaults:
  run:
    working-directory: rust
    shell: bash # With pipefail: a failed exchange stops the step, and never publishes with no token.

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # crates.io answers 403 to a client that does not say who it is, curl's own name included.
      AGENT: pethost-sdk-release (https://github.com/pethost-dev/sdk)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - run: cargo test
      - name: Publish
        run: |
          identity=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=crates.io" | jq -r .value)
          # --fail-with-body: crates.io says in the body why it refused an identity.
          token=$(curl -sS --fail-with-body -A "$AGENT" -X POST https://crates.io/api/v1/trusted_publishing/tokens \
            -H 'Content-Type: application/json' -d "{\"jwt\":\"$identity\"}" | jq -r .token)
          echo "::add-mask::$token"

          CARGO_REGISTRY_TOKEN=$token cargo publish
          curl -fsS -A "$AGENT" -X DELETE https://crates.io/api/v1/trusted_publishing/tokens -H "Authorization: Bearer $token"
